# AI Agent CI — validates that the workspace is agent-friendly
name: AI Agent Check

on:
  pull_request:
    branches: [main]

jobs:
  agent-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check devcontainer exists
        run: |
          test -f .devcontainer/devcontainer.json || {
            echo "::error::Missing .devcontainer/devcontainer.json"
            exit 1
          }

      - name: Check scripts are executable
        run: |
          for f in scripts/*.sh; do
            if [ -f "$f" ] && [ ! -x "$f" ]; then
              echo "::error::$f is not executable"
              exit 1
            fi
          done

      - name: Validate docker-compose
        run: |
          docker compose config --quiet || {
            echo "::error::docker-compose.yml is invalid"
            exit 1
          }

      - name: Check for secrets leakage
        run: |
          # Basic check: no private keys or obvious secrets in tracked files
          if git grep -lE '(PRIVATE KEY|password\s*=\s*["\x27][^"'\'']{8,})' -- ':!*.example' ':!.env.example'; then
            echo "::error::Potential secrets detected in tracked files"
            exit 1
          fi
