      </g>
    </g>
    
    <g id="finePrint">
      <text x="700" y="990" text-anchor="middle" fill="#4a4a4a" font-family="monospace" font-size="7" opacity="0.4">THIS FORM IS VOID IF FILED ON A DAY ENDING IN 'Y'. RETAIN CARBON COPY FOR MINIMUM 99 YEARS. DO NOT FOLD BEND OR FIRST AID.</text>
    </g>
    
    <g id="paperclips">
      <path d="M 1330 20 L 1340 20 L 1340 80 L 1330 80 L 1330 30 L 1335 30 L 1335 75 L 1330 75" fill="none" stroke="#696969" stroke-width="2" opacity="0.5"/>
    </g>
    
    <g id="coffeeStain" opacity="0.15">
