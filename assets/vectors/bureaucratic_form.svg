<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="paperTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply"/>
    </filter>
    <filter id="stampBlur">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>
  
  <rect width="1920" height="1080" fill="#1a1a1a"/>
  
  <g id="formPaper" transform="translate(260, 40)">
    <rect width="1400" height="1000" fill="#e8e4d8" rx="2"/>
    <rect width="1400" height="1000" fill="#e8e4d8" filter="url(#paperTexture)" opacity="0.9" rx="2"/>
    
    <rect x="50" y="30" width="1300" height="4" fill="#2a2a2a" opacity="0.3"/>
    <rect x="50" y="966" width="1300" height="4" fill="#2a2a2a" opacity="0.3"/>
    
    <text x="700" y="80" text-anchor="middle" fill="#2a2a2a" font-family="serif" font-size="28" font-weight="bold" opacity="0.8">FORM MR-7734 // DEPT. OF PERMANENT RECORDS</text>
    <text x="700" y="110" text-anchor="middle" fill="#4a4a4a" font-family="serif" font-size="14" opacity="0.6">BUREAU OF TRANSITIVE AUTHORIZATION — SUBDIVISION 12-C</text>
    
    <line x1="50" y1="130" x2="1350" y2="130" stroke="#2a2a2a" stroke-width="1" opacity="0.4"/>
    
    <g id="formFields">
      <text x="80" y="170" fill="#3a3a3a" font-family="monospace" font-size="11" opacity="0.7">PETITIONER DESIGNATION:</text>
      <line x1="320" y1="172" x2="700" y2="172" stroke="#3a3a3a" stroke-width="0.5" opacity="0.5"/>
      <text x="750" y="170" fill="#3a3a3a" font-family="monospace" font-size="11" opacity="0.7">CLASSIFICATION:</text>
      <line x1="920" y1="172" x2="1100" y2="172" stroke="#3a3a3a" stroke-width="0.5" opacity="0.5"/>
      <text x="1150" y="170" fill="#3a3a3a" font-family="monospace" font-size="11" opacity="0.7">DATE:</text>
      <line x1="1210" y1="172" x2="1350" y2="172" stroke="#3a3a3a" stroke-width="0.5" opacity="0.5"/>
      
      <text x="80" y="210" fill="#3a3a3a" font-family="monospace" font-size="11" opacity="0.7">JURISDICTION CODE:</text>
      <line x1="290" y1="212" x2="500" y2="212" stroke="#3a3a3a" stroke-width="0.5" opacity="0.5"/>
      <text x="550" y="210" fill="#3a3a3a" font-family="monospace" font-size="11" opacity="0.7">CLEARANCE LEVEL:</text>
      <line x1="760" y1="212" x2="900" y2="212" stroke="#3a3a3a" stroke-width="0.5" opacity="0.5"/>
      <text x="950" y="210" fill="#3a3a3a" font-family="monospace" font-size="11" opacity="0.7">REF NO:</text>
      <line x1="1040" y1="212" x2="1350" y2="212" stroke="#3a3a3a" stroke-width="0.5" opacity="0.5"/>
    </g>
    
    <line x1="50" y1="240" x2="1350" y2="240" stroke="#2a2a2a" stroke-width="0.5" opacity="0.3"/>
    
    <g id="bodyText">
      <text x="80" y="275" fill="#3a3a3a" font-family="monospace" font-size="10" opacity="0.6">WHEREAS the undersigned entity, hereinafter referred to as APPLICANT, does hereby submit this petition for</text>
      <text x="80" y="295" fill="#3a3a3a" font-family="monospace" font-size="10" opacity="0.6">consideration under provisions 44.7(b), 112.3(a), and supplementary regulation MR-7734-Δ, and whereas</text>
      <text x="80" y="315" fill="#3a3a3a" font-family="monospace" font-size="10" opacity="0.6">the APPLICANT acknowledges full compliance with all preceding statutes as enumerated in subsection C.12</text>
      <text x="80" y="335" fill="#3a3a3a" font-family="monospace" font-size="10" opacity="0.6">through Q.44, inclusive of all amendments ratified during the 47th session of the Transitional Committee;</text>
      
      <text x="80" y="375" fill="#3a3a3a" font-family="monospace" font-size="10" opacity="0.6">SECTION A: IDENTIFICATION OF SUBJECT ENTITY</text>
      <text x="80" y="400" fill="#3a3a3a" font-family="monospace" font-size="10" opacity="0.5">☐ INDIVIDUAL    ☐ COLLECTIVE    ☐ ABSTRACT    ☐ PENDING CLASSIFICATION</text>
      <text x="80" y="425" fill="#3a3a3a" font-family="monospace" font-size="10" opacity="0.5">☐ TEMPORAL      ☐ PERMANENT     ☐ CONDITIONAL   ☐ REVOCABLE</text>
      
      <text x="80" y="465" fill="#3a3a3a" font-family="monospace" font-size="10" opacity="0.6">SECTION B: STATEMENT OF INTENT (ATTACH FORM MR-7734-B IF EXCEEDING 200 WORDS)</text>
      <line x1="80" y1="490" x2="1320" y2="490" stroke="#3a3a3a" stroke-width="0.5" opacity="0.3"/>
      <line x1="80" y1="510" x2="1320" y2="510" stroke="#3a3a3a" stroke-width="0.5" opacity="0.3"/>
      <line x1="80" y1="530" x2="1320" y2="530" stroke="#3a3a3a" stroke-width="0.5" opacity="0.3"/>
      <line x1="80" y1="550" x2="1320" y2="550" stroke="#3a3a3a" stroke-width="0.5" opacity="0.3"/>
      <line x1="80" y1="570" x2="1320" y2="570" stroke="#3a3a3a" stroke-width="0.5" opacity="0.3"/>
      <line x1="80" y1="590" x2="1320" y2="590" stroke="#3a3a3a" stroke-width="0.5" opacity="0.3"/>
      <line x1="80" y1="610" x2="900" y2="610" stroke="#3a3a3a" stroke-width="0.5" opacity="0.3"/>
      
      <text x="80" y="650" fill="#3a3a3a" font-family="monospace" font-size="10" opacity="0.6">SECTION C: AUTHORIZATION CODES</text>
      <text x="80" y="680" fill="#3a3a3a" font-family="monospace" font-size="10" opacity="0.5">PRIMARY: _______________    SECONDARY: _______________    TERTIARY: _______________</text>
      <text x="80" y="710" fill="#3a3a3a" font-family="monospace" font-size="10" opacity="0.5">OVERRIDE: _______________    EMERGENCY: _______________    VOID IF: _______________</text>
    </g>
    
    <line x1="50" y1="740" x2="1350" y2="740" stroke="#2a2a2a" stroke-width="0.5" opacity="0.3"/>
    
    <g id="signatureArea">
      <text x="80" y="780" fill="#3a3a3a" font-family="monospace" font-size="10" opacity="0.6">SIGNATURE OF AUTHORIZED PARTY:</text>
      <line x1="80" y1="820" x2="500" y2="820" stroke="#3a3a3a" stroke-width="0.5" opacity="0.5"/>
      <text x="80" y="840" fill="#3a3a3a" font-family="monospace" font-size="9" opacity="0.4">(SIGN IN INVISIBLE INK IF CLEARANCE LEVEL EXCEEDS 7)</text>
      
      <text x="750" y="780" fill="#3a3a3a" font-family="monospace" font-size="10" opacity="0.6">WITNESS ATTESTATION:</text>
      <line x1="750" y1="820" x2="1100" y2="820" stroke="#3a3a3a" stroke-width="0.5" opacity="0.5"/>
      <text x="750" y="840" fill="#3a3a3a" font-family="monospace" font-size="9" opacity="0.4">(WITNESS MUST NOT BE THE SAME ENTITY AS APPLICANT)</text>
    </g>
    
    <g id="officialStamps">
      <g transform="translate(1100, 350) rotate(-12)">
        <rect x="-80" y="-35" width="160" height="70" fill="none" stroke="#cc0000" stroke-width="3" opacity="0.7" rx="5"/>
        <text x="0" y="-8" text-anchor="middle" fill="#cc0000" font-family="sans-serif" font-size="18" font-weight="bold" opacity="0.7">APPROVED</text>
        <text x="0" y="15" text-anchor="middle" fill="#cc0000" font-family="monospace" font-size="10" opacity="0.6">REF: 4471-B</text>
      </g>
      
      <g transform="translate(300, 880) rotate(5)">
        <circle cx="0" cy="0" r="55" fill="none" stroke="#cc0000" stroke-width="3" opacity="0.6"/>
        <circle cx="0" cy="0" r="45" fill="none" stroke="#cc0000" stroke-width="1" opacity="0.4"/>
        <text x="0" y="-15" text-anchor="middle" fill="#cc0000" font-family="sans-serif" font-size="10" font-weight="bold" opacity="0.6">DEPT. OF</text>
        <text x="0" y="3" text-anchor="middle" fill="#cc0000" font-family="sans-serif" font-size="10" font-weight="bold" opacity="0.6">PERMANENT</text>
        <text x="0" y="20" text-anchor="middle" fill="#cc0000" font-family="sans-serif" font-size="10" font-weight="bold" opacity="0.6">RECORDS</text>
      </g>
      
      <g transform="translate(900, 900) rotate(-3)">
        <rect x="-100" y="-25" width="200" height="50" fill="none" stroke="#cc0000" stroke-width="2" opacity="0.5"/>
        <text x="0" y="5" text-anchor="middle" fill="#cc0000" font-family="monospace" font-size="16" font-weight="bold" opacity="0.5">CLASSIFIED</text>
      </g>
      
      <g transform="translate(1250, 850) rotate(8)">
        <rect x="-50" y="-20" width="100" height="40" fill="none" stroke="#cc0000" stroke-width="2" opacity="0.5"/>
        <text x="0" y="6" text-anchor="middle" fill="#cc0000" font-family="sans-serif" font-size="14" font-weight="bold" opacity="0.5">DENIED</text>
      </g>
    </g>
    
