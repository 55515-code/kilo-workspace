<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="maskShadow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="singleMask">
      <ellipse cx="0" cy="0" rx="80" ry="100" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="2"/>
      <ellipse cx="-25" cy="-20" rx="18" ry="25" fill="#0a0a0a"/>
      <ellipse cx="25" cy="-20" rx="18" ry="25" fill="#0a0a0a"/>
      <path d="M -30 30 Q 0 45 30 30" fill="none" stroke="#0a0a0a" stroke-width="3"/>
      <path d="M -60 -40 Q -40 -50 -20 -40" fill="none" stroke="#1a1a1a" stroke-width="2"/>
      <path d="M 20 -40 Q 40 -50 60 -40" fill="none" stroke="#1a1a1a" stroke-width="2"/>
      <ellipse cx="-25" cy="-20" rx="12" ry="18" fill="#1a1a1a" opacity="0.5"/>
      <ellipse cx="25" cy="-20" rx="12" ry="18" fill="#1a1a1a" opacity="0.5"/>
    </g>
  </defs>
  
  <rect width="1920" height="1080" fill="#1a1a1a"/>
  
  <g id="maskGrid">
    <use href="#singleMask" x="240" y="180" opacity="0.9"/>
    <use href="#singleMask" x="480" y="180" opacity="0.85"/>
    <use href="#singleMask" x="720" y="180" opacity="0.9"/>
    <use href="#singleMask" x="960" y="180" opacity="0.88"/>
    <use href="#singleMask" x="1200" y="180" opacity="0.9"/>
    <use href="#singleMask" x="1440" y="180" opacity="0.87"/>
    <use href="#singleMask" x="1680" y="180" opacity="0.9"/>
    
    <use href="#singleMask" x="240" y="420" opacity="0.88"/>
    <use href="#singleMask" x="480" y="420" opacity="0.9"/>
    <use href="#singleMask" x="720" y="420" opacity="0.86"/>
    <use href="#singleMask" x="960" y="420" opacity="0.9"/>
    <use href="#singleMask" x="1200" y="420" opacity="0.89"/>
    <use href="#singleMask" x="1440" y="420" opacity="0.9"/>
    <use href="#singleMask" x="1680" y="420" opacity="0.87"/>
    
    <use href="#singleMask" x="240" y="660" opacity="0.9"/>
    <use href="#singleMask" x="480" y="660" opacity="0.87"/>
    <use href="#singleMask" x="720" y="660" opacity="0.9"/>
    <use href="#singleMask" x="960" y="660" opacity="0.85"/>
    <use href="#singleMask" x="1200" y="660" opacity="0.9"/>
    <use href="#singleMask" x="1440" y="660" opacity="0.88"/>
    <use href="#singleMask" x="1680" y="660" opacity="0.9"/>
    
    <use href="#singleMask" x="240" y="900" opacity="0.87"/>
    <use href="#singleMask" x="480" y="900" opacity="0.9"/>
    <use href="#singleMask" x="720" y="900" opacity="0.89"/>
    <use href="#singleMask" x="960" y="900" opacity="0.9"/>
    <use href="#singleMask" x="1200" y="900" opacity="0.86"/>
    <use href="#singleMask" x="1440" y="900" opacity="0.9"/>
    <use href="#singleMask" x="1680" y="900" opacity="0.88"/>
  </g>
  
  <g id="subtleVariations">
    <line x1="200" y1="300" x2="280" y2="300" stroke="#2a2a2a" stroke-width="1" opacity="0.3"/>
    <line x1="440" y1="540" x2="520" y2="540" stroke="#2a2a2a" stroke-width="1" opacity="0.3"/>
    <line x1="680" y1="780" x2="760" y2="780" stroke="#2a2a2a" stroke-width="1" opacity="0.3"/>
    <line x1="920" y1="300" x2="1000" y2="300" stroke="#2a2a2a" stroke-width="1" opacity="0.3"/>
    <line x1="1160" y1="540" x2="1240" y2="540" stroke="#2a2a2a" stroke-width="1" opacity="0.3"/>
    <line x1="1400" y1="780" x2="1480" y2="780" stroke="#2a2a2a" stroke-width="1" opacity="0.3"/>
    <line x1="1640" y1="300" x2="1720" y2="300" stroke="#2a2a2a" stroke-width="1" opacity="0.3"/>
  </g>
</svg>
