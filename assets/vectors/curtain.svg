<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="curtainGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="leftCurtainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b0000;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#6b0000;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4a0000;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="rightCurtainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a0000;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#6b0000;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#8b0000;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c4a000;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#a08000;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#c4a000;stop-opacity:0.8"/>
    </linearGradient>
  </defs>
  
