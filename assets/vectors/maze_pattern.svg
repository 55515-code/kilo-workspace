<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2d2d2d" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <rect width="1920" height="1080" fill="#1a1a1a"/>
  <rect width="1920" height="1080" fill="url(#gridPattern)"/>
  
  <g id="mazeStructure">
    <path d="M 100 100 L 300 100 L 300 200 L 500 200 L 500 100 L 700 100 L 700 300 L 900 300 L 900 100 L 1100 100 L 1100 200 L 1300 200 L 1300 100 L 1500 100 L 1500 300 L 1700 300 L 1700 100 L 1820 100" 
          fill="none" stroke="#2d2d2d" stroke-width="8"/>
