    <circle cx="1200" cy="600" r="15" fill="none" stroke="#ff00ff" stroke-width="2" filter="url(#strongGlow)"/>
    <circle cx="1600" cy="400" r="15" fill="none" stroke="#00ffff" stroke-width="2" filter="url(#strongGlow)"/>
    
    <path d="M 400 300 L 800 500 M 800 500 L 1200 600 M 1200 600 L 1600 400" 
          fill="none" stroke="#ff00ff" stroke-width="1" stroke-dasharray="5,5" filter="url(#neonGlow)" opacity="0.6"/>
    
    <rect x="250" y="250" width="100" height="100" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.3"/>
    <rect x="650" y="450" width="100" height="100" fill="none" stroke="#ff00ff" stroke-width="1" opacity="0.3"/>
