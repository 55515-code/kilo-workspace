    <path d="M 100 400 L 300 400 L 300 600 L 500 600 L 500 500 L 700 500 L 700 700 L 900 700 L 900 600 L 1100 600 L 1100 800 L 1300 800 L 1300 600 L 1500 600 L 1500 700 L 1700 700 L 1700 500 L 1820 500" 
          fill="none" stroke="#2d2d2d" stroke-width="8"/>
