  <g id="impossiblePaths" opacity="0.4">
    <path d="M 960 540 Q 1060 440 1160 540 Q 1060 640 960 540" fill="none" stroke="#ff00ff" stroke-width="1" filter="url(#neonGlow)"/>
    <path d="M 960 540 Q 860 440 760 540 Q 860 640 960 540" fill="none" stroke="#00ffff" stroke-width="1" filter="url(#neonGlow)"/>
